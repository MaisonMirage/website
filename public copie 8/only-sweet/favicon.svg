<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    ONLY SWEET — Favicon v2
    Refined cherry with gradient hint.
  -->
  <defs>
    <radialGradient id="cherryGrad" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#E84B6A"/>
      <stop offset="100%" stop-color="#D93654"/>
    </radialGradient>
  </defs>
  <!-- Cherry body -->
  <circle cx="16" cy="19" r="11" fill="url(#cherryGrad)"/>
  <!-- Highlight -->
