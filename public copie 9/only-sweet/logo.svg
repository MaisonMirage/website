<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" fill="none">
  <!--
    ONLY SWEET — Logo v5 (Refined)
    Confection Précieuse design system.
    Lora serif + italic. Cherry dot separator.
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap');
  </style>

  <!-- "Only" — burgundy ink, regular -->
  <text
    x="0" y="36"
    font-family="'Lora', Georgia, serif"
    font-size="36"
    font-weight="400"
    fill="#3D1A2E"
    letter-spacing="-0.5"
  >Only</text>

  <!-- Cherry dot — brand atom -->
  <circle cx="105" cy="30" r="4" fill="#D93654"/>
  <!-- Cherry highlight -->
  <ellipse cx="103.8" cy="28.8" rx="1.5" ry="1" fill="rgba(255,255,255,0.25)" transform="rotate(-15 103.8 28.8)"/>
  <!-- Tiny stem -->
  <path d="M105 26.5 C105.8 23 107.5 21.5 109 22" stroke="#5A7A42" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Tiny leaf -->
  <path d="M108 22.5 C109.2 21 110.8 21.2 110.2 23 C109.6 24.5 108 23.5 108 22.5Z" fill="#6B8E4E"/>

  <!-- "Sweet" — cherry pink, italic -->
  <text
    x="118" y="36"
    font-family="'Lora', Georgia, serif"
    font-size="36"
    font-weight="400"
    font-style="italic"
    fill="#E84B8A"
    letter-spacing="-0.5"
  >Sweet</text>
</svg>