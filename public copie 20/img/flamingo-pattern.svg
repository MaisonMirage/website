<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Flamingo silhouette pattern -->
  <defs>
    <style>
      .flamingo { fill: #F990E8; }
    </style>
  </defs>

  <!-- Flamingo body standing -->
  <g class="flamingo">
    <!-- Left leg -->
    <path d="M 45 85 L 42 155" stroke="#F990E8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Right leg -->
    <path d="M 60 85 L 63 155" stroke="#F990E8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="52" cy="70" rx="16" ry="22" fill="#F990E8"/>

    <!-- Neck -->
    <path d="M 52 50 Q 50 35 52 20" stroke="#F990E8" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="52" cy="12" r="6" fill="#F990E8"/>

    <!-- Beak -->
    <path d="M 58 12 L 70 10 Q 72 12 70 14 L 58 12" fill="#F990E8"/>

    <!-- Eye dot -->
    <circle cx="55" cy="10" r="1.2" fill="#1a1025"/>
  </g>
</svg>
